name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Current pytest-homeassistant-custom-component needs 3.14; on 3.13 uv
          # would resolve a months-old Home Assistant instead.
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  panel:
    name: Admin panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The committed bundle must match the source
        run: git diff --exit-code -- ../custom_components/doormonitor/frontend

  # Tag and publish a GitHub release (what HACS offers as an update) whenever
  # main carries a manifest version that has not been released yet.
  release:
    needs: [hassfest, tests, panel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release manifest version if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version custom_components/doormonitor/manifest.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          git log --pretty='- %s' "${previous:+$previous..}HEAD" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
